server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:mem:crowd_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.ml-service.url=${ML_SERVICE_URL:http://localhost:5001}

# Redis cache (falls back gracefully if REDIS_HOST is unset in local/dev runs
# without Docker - see CacheConfig for the simple/no-op fallback profile)
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cache.locations-ttl-seconds=${LOCATIONS_CACHE_TTL_SECONDS:60}
app.cache.counters-ttl-seconds=${COUNTERS_CACHE_TTL_SECONDS:30}

# Camera frame uploads (POST /api/camera/count)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
