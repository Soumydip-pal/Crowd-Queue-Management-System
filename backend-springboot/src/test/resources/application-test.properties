# Test profile: in-memory H2 (unique DB per JVM to avoid clashing with any
# locally running app), simple in-memory cache instead of Redis so tests
# don't need a live Redis server, and a fixed JWT secret for reproducibility.
spring.datasource.url=jdbc:h2:mem:crowd_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

spring.cache.type=simple

app.jwt.secret=test-only-secret-not-for-production-use
app.ml-service.url=http://localhost:59999
