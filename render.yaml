# Render Blueprint - deploys the backend API, ML service, managed Postgres,
# and a Redis-compatible Key Value store with one click.
#
# The React frontend is NOT included here on purpose: it deploys much more
# simply as a Render Static Site (no Docker/port wiring needed) - see the
# "Deploy on Render" section of README.md, done once after this Blueprint
# finishes so you can point it at the backend's live URL.
#
# Usage: push this repo to GitHub, then in the Render Dashboard choose
# New -> Blueprint and select the repo. Render reads this file automatically.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: crowd-postgres
    plan: free
    databaseName: crowd_management
    user: crowd_user

services:
  - type: keyvalue
    name: crowd-redis
    plan: free
    ipAllowList: [] # internal connections only (from other Render services)

  - type: web
    name: crowd-ml-service
    runtime: docker
    plan: free
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    healthCheckPath: /health

  - type: web
    name: crowd-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend-springboot/Dockerfile
    dockerContext: ./backend-springboot
    healthCheckPath: /api/health
    envVars:
      # --- Database (built from Render Postgres' individual fields, since
      # its connectionString isn't in jdbc: format) ---
      - key: DB_HOST
        fromDatabase:
          name: crowd-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: crowd-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: crowd-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: crowd-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: crowd-postgres
          property: password
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DDL_AUTO
        value: update

      # --- Redis (Key Value) ---
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: crowd-redis
          property: connectionString

      # --- ML service ---
      - key: ML_SERVICE_HOSTPORT
        fromService:
          type: web
          name: crowd-ml-service
          property: hostport
      - key: ML_SERVICE_URL
        value: http://${ML_SERVICE_HOSTPORT}

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"

      # After deploying the frontend Static Site (see README), update this to
      # its real URL, e.g. https://crowd-dashboard.onrender.com - otherwise
      # the frontend's requests will be blocked by CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
